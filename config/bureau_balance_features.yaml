tabla: bureau_balance
nivel: SK_ID_CURR (doble agregación desde SK_ID_BUREAU vía bureau)
nota: 'cobertura del 29,99% de train, completa por cliente en el 99,78% de los casos.
  Cruces con TARGET sobre train completo: los descartes por señal son provisionales
  y se reconfirman sobre el split, los de redundancia estructural son firmes y los
  marca el campo firmeza. Medir IV incremental sobre EXT_SOURCE_3 antes de fijar la
  lista. Tres parámetros se eligieron comparando rendimiento contra la tasa de default
  y no son constantes de dominio, así que hay que refijarlos sobre el split: el denominador
  mínimo de 6 meses reportados de BB_PCT_MONTHS_DPD, el corte de 6 meses de la mora
  reciente y el de 22 créditos de la cola.'
metodologia:
  efectos_sobre: train completo, no sobre el split de entrenamiento
  alfa_bonferroni: 0.001923
  n_features: 24
esquema:
  tipo: flag (efecto en pp) o continua (efecto en rank-biserial)
  codificacion: cómo entra la feature cuando no es la columna cruda ('> 0', '| historial')
  poblacion_medicion: sobre qué clientes se midió; los efectos NO son comparables
    entre poblaciones distintas
  n: tamaño de la población de medición (solo continuas)
  n_marcados: clientes con la bandera a 1 (solo flags)
  efecto: tamaño del efecto, en la unidad que declara `unidad`
  unidad: pp para banderas, rank_biserial para continuas
  p: p-valor del contraste (z-test en banderas, Mann-Whitney en continuas)
  significativa_bonferroni: si p supera el alfa corregido que declara `metodologia`
  decision: conservar | iv | degradada | descartar | control | referencia
  firmeza: firme = target-independiente (redundancia estructural), no hay que rehacerlo
    sobre el split; provisional = decidido contra el TARGET sobre train completo,
    se reconfirma
  control: true si la feature se queda como control pase lo que pase con su capacidad
    predictiva
  estado: la cadena original del ranking, verbatim, con el matiz que no cabe en `decision`
