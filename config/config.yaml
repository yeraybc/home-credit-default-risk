paths:
  raw_data:       "data/raw"
  processed_data: "data/processed"
  external_data:  "data/external"
  models:         "models"
  reports:        "monitoring/reports"

# Este fichero lleva infraestructura. Los cortes de modelado viven en src/features/params.py,
# que es donde cada uno declara su procedencia y si hay que reajustarlo sobre el split.
# De aqui salieron min_iv, n_bins_max y correlation_threshold (que valia 0,95 mientras el
# umbral real del proyecto es 0,70), y se elimino missing_threshold, porque el EDA decide los
# nulos columna a columna con IV y no con un umbral unico.

dataset:
  target_col:         "TARGET"
  id_col:             "SK_ID_CURR"
  test_size:          0.2
  random_state:       42

modeling:
  random_state:    42
  cv_folds:        5
  optuna_metric:   "roc_auc"
  optuna_n_trials: 100
  decision_threshold: 0.5

monitoring:
  psi_threshold:   0.2    # > 0.2 → drift significativo, reentrenar
  drift_threshold: 0.05

api:
  host:          "0.0.0.0"
  port:          8000
  model_name:    "credit_scoring_ensemble"
  model_version: "latest"

mlflow:
  experiment_name: "home-credit-default-risk"
  tracking_uri:    "mlruns"
