tabla: previous_application
nivel: SK_ID_CURR (enlace directo, sin tabla puente)
nota: 'cobertura del 94,65% de train, la más alta de las tres auxiliares. Quien no
  tiene solicitudes previas es de menor riesgo (5,96% frente a 8,19%), así que el
  relleno con cero infla lo que penaliza en lugar de enmascararlo. Cruces con TARGET
  sobre train completo: las dos que quedan a decidir por IV son provisionales y se
  reconfirman sobre el split; los tres descartes por redundancia estructural son firmes.
  Sobre el split hay que fijar el mínimo de denominador del ratio de rechazo (0,1204
  con cobertura total frente a 0,1558 cubriendo el 81,95%) y refijar los cortes medidos
  aquí: las 15 solicitudes, las 4 en doce meses, el año de adelanto en la liquidación,
  las 60 cuotas y el 1,1 de sobreconcesión.'
