name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Sintaxis, tipografia y dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # El proyecto es 3.9, pero check.py es un verificador estatico (ast.parse, no
      # importa nada) y necesita sys.stdlib_module_names, que es 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verificación
        run: python .github/scripts/check.py

      # La version sale de requirements-dev.txt para no tener el pin en dos sitios.
      - name: Lint
        run: |
          grep '^ruff==' requirements-dev.txt | xargs pip install
          ruff check src/

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Aqui si se instala el stack, y en la version del proyecto: los tests ejercitan
      # reduce_mem_usage y EvaluadorSenal de verdad, no solo su sintaxis.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalación
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Pytest
        run: pytest tests/
