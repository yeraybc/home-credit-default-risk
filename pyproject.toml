[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "home-credit-scoring"
version = "0.1.0"
description = "End-to-end credit scoring pipeline: EDA → FE → XGBoost/LightGBM → SHAP → FastAPI → Docker → Evidently"
authors = [{ name = "Yeray Benito Calviño" }]
# Techo en 3.13: numpy 2.0.2 y scipy 1.13.1 no publican wheels para cp313, asi que
# instalar ahi obliga a compilar desde fuente.
requires-python = ">=3.9,<3.13"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

# --- Ruff (linter + formatter) -----------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# ANN101 y ANN102 estaban en ignore, pero ruff ya las eliminó y solo generaban un warning.
select = ["E", "F", "W", "I", "N", "UP", "ANN001", "ANN201"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["ANN001", "ANN201", "E402"]
# N806 por lo mismo que abajo: los tests de los transformers llaman a fit(X, y) con el nombre
# que usa scikit-learn, y son 48 avisos que enterraban a los que si dicen algo. Con ellos fuera,
# ruff sobre tests/ sale limpio y puede entrar en CI, que es lo que caza el test duplicado.
"tests/*"     = ["ANN001", "ANN201", "N803", "N806"]
# La X mayuscula de fit(X, y) es el nombre que usa scikit-learn en toda su API y el que espera
# quien lee un transformer. Renombrarla aqui seria apartarse del contrato para contentar al
# linter, asi que se acota al fichero de los transformers y no se abre en todo src.
"src/features/transformers.py" = ["N803", "N806"]
# Lo mismo para los folds: X e y son los nombres de scikit-learn, y `X_ajuste` y `X_eval` los de
# lo que sale de ajustar y transformar con ellos.
"src/models/folds.py" = ["N803", "N806"]
# Y la evaluacion, que recibe X de la API de scikit-learn en `_proba_impago()`.
"src/models/evaluar.py" = ["N803"]
# Y el cronometro, que mide sobre la X y la y de los folds.
"src/models/tiempos.py" = ["N803", "N806"]

# --- Black (code formatter) --------------------------------------------------
[tool.black]
line-length    = 100
target-version = ["py39"]

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"
# Deprecaciones de pyparsing que emite matplotlib al importarse: ruido de terceros.
filterwarnings = ["ignore::DeprecationWarning:pyparsing.*"]

# --- MyPy (type checker, opcional pero recomendado) --------------------------
[tool.mypy]
python_version         = "3.9"
ignore_missing_imports = true
warn_return_any        = true
